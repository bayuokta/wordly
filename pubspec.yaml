name: wordly
description: "Wordly — belajar kosakata Inggris–Indonesia dengan pengulangan berjarak, offline-first."
publish_to: 'none'
version: 0.1.7+8

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  go_router: ^18.1.4
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: 0.14.0
  flutter_native_splash: ^2.2.16

flutter:
  uses-material-design: true

  assets:
    - assets/vocab/
    - assets/sounds/

  fonts:
    # Display face — judul, angka, kata utama.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Body face — teks isi.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Pronunciation face — simbol IPA.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0E1116"
  image: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#0E1116"
    image: assets/branding/splash_logo.png
